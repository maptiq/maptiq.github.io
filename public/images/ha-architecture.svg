<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" font-family="Inter, Arial, sans-serif">
  <title>High availability GIS reference architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#25272b"/></marker>
  </defs>
  <rect width="720" height="460" rx="14" fill="#f3f4f6"/>
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#25272b">
    <!-- clients -->
    <rect x="270" y="18" width="180" height="40" rx="8" fill="#fff" stroke="#25272b" stroke-width="1.5"/>
    <text x="360" y="43">Web, mobile, API clients</text>
    <line x1="360" y1="58" x2="360" y2="82" stroke="#25272b" stroke-width="1.5" marker-end="url(#a)"/>
    <!-- LB -->
    <rect x="200" y="84" width="320" height="44" rx="8" fill="#25272b"/>
    <text x="360" y="111" fill="#f5c400">Load balancer pair (HAProxy, virtual IP)</text>
    <line x1="290" y1="128" x2="190" y2="160" stroke="#25272b" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="430" y1="128" x2="530" y2="160" stroke="#25272b" stroke-width="1.5" marker-end="url(#a)"/>
    <!-- zones -->
    <rect x="30" y="162" width="320" height="226" rx="10" fill="#fff" stroke="#9a9ca1" stroke-dasharray="6 4"/>
    <rect x="370" y="162" width="320" height="226" rx="10" fill="#fff" stroke="#9a9ca1" stroke-dasharray="6 4"/>
    <text x="190" y="182" font-size="11" fill="#5a6270">ZONE A</text>
    <text x="530" y="182" font-size="11" fill="#5a6270">ZONE B</text>
    <!-- app -->
    <rect x="50" y="194" width="280" height="50" rx="8" fill="#e6e7e8"/>
    <text x="190" y="215">Map services</text>
    <text x="190" y="233" font-size="11" font-weight="500" fill="#5a6270">GeoServer, MapProxy, vector tiles, API</text>
    <rect x="390" y="194" width="280" height="50" rx="8" fill="#e6e7e8"/>
    <text x="530" y="215">Map services</text>
    <text x="530" y="233" font-size="11" font-weight="500" fill="#5a6270">GeoServer, MapProxy, vector tiles, API</text>
    <!-- db -->
    <line x1="190" y1="244" x2="190" y2="272" stroke="#25272b" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="530" y1="244" x2="530" y2="272" stroke="#25272b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="50" y="274" width="280" height="50" rx="8" fill="#f5c400"/>
    <text x="190" y="295">PostgreSQL + PostGIS primary</text>
    <text x="190" y="313" font-size="11" font-weight="500">Patroni, automatic failover</text>
    <rect x="390" y="274" width="280" height="50" rx="8" fill="#fbe58a"/>
    <text x="530" y="295">PostgreSQL + PostGIS replica</text>
    <text x="530" y="313" font-size="11" font-weight="500">streaming replication</text>
    <line x1="330" y1="299" x2="388" y2="299" stroke="#25272b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="190" y="354" font-size="11" font-weight="500" fill="#5a6270">distributed consensus (etcd), 3 voting members</text>
    <text x="530" y="354" font-size="11" font-weight="500" fill="#5a6270">tested restore, off-site backup (pgBackRest)</text>
    <!-- monitoring -->
    <rect x="30" y="404" width="660" height="38" rx="8" fill="#25272b"/>
    <text x="360" y="428" fill="#fff">Monitoring, alerting, logs and automated deployment, on every layer</text>
  </g>
</svg>
